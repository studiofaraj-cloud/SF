# apphosting.yaml
# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  runtime: nodejs20
  cpu: 1
  memoryMiB: 1024
  timeoutSeconds: 60
  concurrency: 80
  minInstances: 0
  maxInstances: 100

env:
  # Public site URL (used for SEO, sitemaps, og:url)
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://studiofarajnext.web.app
    availability:
      - BUILD
      - RUNTIME

  # Firebase project ID (public)
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studiofarajnext
    availability:
      - BUILD
      - RUNTIME

  # FormSubmit email notifications (legacy)
  - variable: FORMSUBMIT_ENDPOINT
    value: https://formsubmit.co/ajax/info@studiofaraj.it
    availability:
      - RUNTIME

  # Brevo transactional email — sender address (not secret)
  - variable: EMAIL_FROM
    value: Studio Faraj <info@studiofaraj.it>
    availability:
      - RUNTIME

  # Custom domain used inside email templates (logo URL, footer link, CTAs).
  # Kept separate from NEXT_PUBLIC_SITE_URL so emails always point at the
  # public custom domain regardless of where the app is hosted.
  - variable: EMAIL_SITE_URL
    value: https://studiofaraj.it
    availability:
      - RUNTIME

  # ----- SECRETS (stored in Firebase Secret Manager) -----
  # Create each secret once before deploying:
  #   firebase apphosting:secrets:set SESSION_SECRET
  #   firebase apphosting:secrets:set GEMINI_API_KEY
  #   firebase apphosting:secrets:set GOOGLE_API_KEY
  #
  # Firebase public config (NEXT_PUBLIC_FIREBASE_API_KEY, etc.)
  # should also be added as secrets:
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_API_KEY
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_APP_ID
  #   firebase apphosting:secrets:set NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID

  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: GOOGLE_API_KEY
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_PLACES_API_KEY
    secret: GOOGLE_PLACES_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: GOOGLE_PLACE_ID
    secret: GOOGLE_PLACE_ID
    availability:
      - BUILD
      - RUNTIME

  # Brevo API key — stored as secret
  #   firebase apphosting:secrets:set BREVO_API_KEY
  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - RUNTIME

  # ----- Stripe (payments) -----
  # Create each secret once before deploying (use TEST keys first):
  #   firebase apphosting:secrets:set STRIPE_SECRET_KEY
  #   firebase apphosting:secrets:set STRIPE_WEBHOOK_SECRET
  # Webhook endpoint to register in the Stripe dashboard:
  #   https://<your-domain>/api/stripe/webhook   (event: checkout.session.completed)
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Stripe price IDs for the Company Profile subscription (NOT secret —
  # they're public identifiers visible in the Stripe Checkout URL).
  # Create the prices in Stripe Dashboard (LIVE mode) under the "Pagina
  # Aziendale" product, then paste the ids below:
  #   - €4.99/month → STRIPE_COMPANY_PROFILE_PRICE_ID
  #   - €49.99/year → STRIPE_COMPANY_PROFILE_PRICE_ID_ANNUAL
  - variable: STRIPE_COMPANY_PROFILE_PRICE_ID
    value: price_1TeDYvQf84zoAYlwI9mtwljM
    availability:
      - RUNTIME

  - variable: STRIPE_COMPANY_PROFILE_PRICE_ID_ANNUAL
    value: price_1TeDb1Qf84zoAYlwPacgHvMd
    availability:
      - RUNTIME

  # ----- App Check (anti-bot) -----
  # Public reCAPTCHA v3 site key. App Check stays OFF until this is set.
  # Setup:
  #   1) Firebase Console → App Check → register the web app with reCAPTCHA v3
  #      (this also creates the reCAPTCHA key) and copy the SITE key.
  #   2) Set it here (it is public, so a plain value is fine):
  #        NEXT_PUBLIC_RECAPTCHA_SITE_KEY
  #   3) For local dev, set a debug token: in the browser console the SDK prints
  #      an App Check debug token — add it under App Check → Apps → Manage debug tokens.
  #   4) Enforce per service (Firestore, Storage, Authentication) in App Check
  #      once real traffic shows tokens flowing.
  # - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
  #   value: "<your-recaptcha-v3-site-key>"
  #   availability:
  #     - BUILD
  #     - RUNTIME
