<!doctype html>
<!--
  Studio Faraj OG image, 1200×630. Rendered by scripts/generate-og-image.mjs.
  ?lang=en for the English copy; ?still to freeze the rings in place (the
  link-preview image); without it the rings ripple out from the logo in a
  4 s loop (the animated version for social posts).
-->
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Schibsted+Grotesk:wght@800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0A1628; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0A1628; color: #fff; font-family: Poppins, system-ui, sans-serif; }
  .disp { font-family: 'Schibsted Grotesk', Poppins, sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 0.95; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace; letter-spacing: 0.16em; text-transform: uppercase; }

  .glow { position: absolute; right: 40px; top: 10px; width: 620px; height: 620px; border-radius: 50%; background: rgba(59, 130, 246, 0.35); filter: blur(90px); }
  /* The rings share the logo's centre: (855, 315). */
  .ring { position: absolute; left: 855px; top: 315px; border-radius: 50%; border: 2px solid rgb(125, 211, 252); transform: translate(-50%, -50%); }
  .still .r1 { width: 300px; height: 300px; border-width: 3px; opacity: 0.42; }
  .still .r2 { width: 420px; height: 420px; opacity: 0.34; }
  .still .r3 { width: 540px; height: 540px; opacity: 0.26; }
  .still .r4 { width: 660px; height: 660px; opacity: 0.18; }
  .still .r5 { width: 780px; height: 780px; opacity: 0.1; }

  /* Animated: each ring grows from the logo's edge and fades, one every 0.8 s. */
  .moving .ring { width: 300px; height: 300px; animation: ripple 4s linear infinite; }
  .moving .r2 { animation-delay: -0.8s; }
  .moving .r3 { animation-delay: -1.6s; }
  .moving .r4 { animation-delay: -2.4s; }
  .moving .r5 { animation-delay: -3.2s; }
  @keyframes ripple {
    0% { width: 270px; height: 270px; opacity: 0; }
    8% { opacity: 0.5; }
    100% { width: 860px; height: 860px; opacity: 0; }
  }

  .mark { position: absolute; left: 730px; top: 190px; width: 250px; height: 250px; }
  .brand { position: absolute; left: 80px; top: 78px; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .eyebrow { position: absolute; left: 80px; top: 196px; font-size: 17px; color: rgba(255, 255, 255, 0.6); display: flex; align-items: center; gap: 12px; }
  .eyebrow i { width: 10px; height: 10px; border-radius: 99px; background: #34d399; }
  h1 { position: absolute; left: 78px; top: 240px; font-size: 92px; width: 640px; }
  html[lang='en'] h1 { font-size: 74px; top: 254px; }
  .lead { position: absolute; left: 80px; top: 452px; width: 580px; font-size: 25px; line-height: 1.45; color: rgba(255, 255, 255, 0.72); }
  .url { position: absolute; left: 80px; bottom: 56px; font-family: ui-monospace, Consolas, monospace; font-size: 22px; color: #7dd3fc; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="glow"></div>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="ring r5"></div>
  <img class="mark" src="mark.svg" alt="">
  <p class="brand">Studio Faraj</p>
  <p class="eyebrow mono"><i></i><span data-t="eyebrow"></span></p>
  <h1 class="disp" data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <p class="url">studiofaraj.it</p>
</div>
<script>
  const COPY = {
    it: { eyebrow: 'Agenzia web · Padova', title: 'Siti scritti<br>riga per riga.', lead: 'Siti, e-commerce e piattaforme su misura. Niente template: il codice resta tuo.' },
    en: { eyebrow: 'Web agency · Padova, Italy', title: 'Websites written<br>line by line.', lead: 'Websites, e-commerce and platforms built to measure. No templates: the code stays yours.' },
  };
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'en' ? 'en' : 'it';
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = COPY[lang][el.dataset.t];
  document.getElementById('og').classList.add(q.has('still') ? 'still' : 'moving');
</script>
</body>
</html>
