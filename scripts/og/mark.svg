<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Studio Faraj mark, redrawn as geometry from the 512 px app icon:
       a disc with a "planet" (two dots inside), a small dot, and the line
       between them cut out. fill = the disc's colour. -->
  <defs>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="114.4" cy="402.3" r="173.3" fill="#000"/>
      <circle cx="345.8" cy="163.9" r="50" fill="#000"/>
      <line x1="345.8" y1="163.9" x2="114.4" y2="402.3" stroke="#000" stroke-width="25"/>
      <circle cx="84.7" cy="301.7" r="33.9" fill="#fff"/>
      <circle cx="214.4" cy="431.6" r="33.3" fill="#fff"/>
    </mask>
  </defs>
  <circle cx="256" cy="256" r="256" fill="#fff" mask="url(#cut)"/>
</svg>
